<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike SB RPM Master Archive | Digital Museum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .skew-title { transform: skewX(-12deg); }
        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .dc-label { color: #f97316; font-weight: 800; font-size: 0.65rem; letter-spacing: 0.05em; }
        .prose-text { line-height: 1.8; letter-spacing: -0.01em; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 selection:bg-orange-500">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const INITIAL_DATA = [
            { 
                id: 1, 
                dc_title: "RPM Backpack - Black Anthracite",
                dc_identifier: "BA3241-001", 
                dc_date: "2012", 
                dc_creator: "Nike SB Design Team",
                dc_subject: "Skateboarding Equipment; Luggage; RPM Series",
                dc_description: "The original 26L RPM silhouette featuring 600D polyester, external skateboard straps, and a curved shoulder strap system.",
                dc_publisher: "Nike, Inc.",
                dc_contributor: "James Arizumi (Creative Lead)",
                dc_type: "Physical Object",
                dc_format: "Textile; 600D Polyester; 53cm x 33cm x 16.5cm",
                dc_source: "Nike SB Summer 2012 Catalog",
                dc_language: "en-US",
                dc_relation: "Preceded by Nike SB Eugene; Succeeded by RPM 2.0",
                dc_coverage: "Beaverton, Oregon",
                dc_rights: "© Nike, Inc. All rights reserved.",
                colorway: "Black/Black",
                rarity: "Common"
            },
            { 
                id: 2, 
                dc_title: "RPM Backpack - Iguana Camo",
                dc_identifier: "BA3241-200", 
                dc_date: "2014", 
                dc_creator: "Nike SB Design Team",
                dc_subject: "Skateboarding Equipment; Camouflage Patterns; Tactical Aesthetics",
                dc_description: "Woodland-inspired Iguana Camo variant of the RPM. Notable for the textured 'duck canvas' feel of the polyester weave.",
                dc_publisher: "Nike, Inc.",
                dc_contributor: "Nike SB Apparel Division",
                dc_type: "Physical Object",
                dc_format: "Textile; 600D Polyester",
                dc_source: "Nike SB Q3 2014 Footwear & Apparel Guide",
                dc_language: "en-US",
                dc_relation: "Part of the 'Iguana Pack' 2014",
                dc_coverage: "Global Release",
                dc_rights: "© Nike, Inc. All rights reserved.",
                colorway: "Iguana/Black",
                rarity: "Uncommon"
            },
            { 
                id: 3, 
                dc_title: "RPM Backpack - Solar Red",
                dc_identifier: "BA3241-601", 
                dc_date: "2015", 
                dc_creator: "Nike SB Design Team",
                dc_subject: "Skateboarding Equipment; High-Visibility Design",
                dc_description: "A high-saturation Solar Red colorway, highlighting the unique RPM webbing and hardware contrast.",
                dc_publisher: "Nike, Inc.",
                dc_contributor: "Nike SB Lifestyle Group",
                dc_type: "Physical Object",
                dc_format: "Textile; Synthetic Fiber",
                dc_source: "Archive Records #601-2015",
                dc_language: "en-US",
                dc_relation: "Colorway inspired by Nike Air Yeezy 2 'Solar Red'",
                dc_coverage: "Limited North America Release",
                dc_rights: "© Nike, Inc. All rights reserved.",
                colorway: "Solar Red/White",
                rarity: "Rare"
            }
        ];

        const App = () => {
            const [view, setView] = useState('intro'); // intro, catalog, essay
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedYear, setSelectedYear] = useState('All');
            const [selectedItem, setSelectedItem] = useState(null);
            const [showDC, setShowDC] = useState(false);

            const years = ['All', ...new Set(INITIAL_DATA.map(item => item.dc_date))].sort((a, b) => b - a);

            const filteredData = useMemo(() => {
                return INITIAL_DATA.filter(item => {
                    const matchesSearch = item.dc_title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          item.dc_identifier.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesYear = selectedYear === 'All' || item.dc_date === selectedYear;
                    return matchesSearch && matchesYear;
                });
            }, [searchTerm, selectedYear]);

            // Navigation handler
            const navigate = (newView) => {
                setView(newView);
                window.scrollTo(0, 0);
            };

            return (
                <div className="min-h-screen">
                    <header className="border-b border-zinc-800 bg-zinc-950/90 backdrop-blur-xl sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 h-24 flex items-center justify-between">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => navigate('intro')}>
                                <div className="w-12 h-12 bg-orange-600 rounded-none flex items-center justify-center font-black text-2xl skew-title text-black">SB</div>
                                <div>
                                    <h1 className="font-black text-2xl tracking-tighter uppercase italic leading-none">RPM Master Archive</h1>
                                    <p className="text-[10px] text-zinc-500 font-mono tracking-widest uppercase mt-1">Digital Museum</p>
                                </div>
                            </div>
                            <nav className="hidden md:flex gap-8 items-center uppercase text-[10px] font-black tracking-[0.2em]">
                                <button onClick={() => navigate('intro')} className={`${view === 'intro' ? 'text-orange-500' : 'text-zinc-500 hover:text-white'} transition-colors`}>Introduction</button>
                                <button onClick={() => navigate('catalog')} className={`${view === 'catalog' ? 'text-orange-500' : 'text-zinc-500 hover:text-white'} transition-colors`}>The Archive</button>
                                <button onClick={() => navigate('essay')} className={`${view === 'essay' ? 'text-orange-500' : 'text-zinc-500 hover:text-white'} transition-colors`}>Methodology</button>
                            </nav>
                        </div>
                    </header>

                    {/* View Controller */}
                    {view === 'intro' && (
                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-1000">
                            {/* Hero Section */}
                            <section className="relative h-[80vh] flex items-center justify-center overflow-hidden border-b border-zinc-900">
                                <div className="absolute inset-0 z-0 opacity-20">
                                    <div className="absolute inset-0 bg-gradient-to-b from-transparent to-zinc-950"></div>
                                    <div className="grid grid-cols-12 h-full opacity-10">
                                        {[...Array(48)].map((_, i) => <div key={i} className="border border-zinc-800"></div>)}
                                    </div>
                                </div>
                                <div className="relative z-10 text-center max-w-4xl px-4">
                                    <span className="text-orange-500 font-black text-xs tracking-[0.4em] uppercase mb-6 block">Preservation Project</span>
                                    <h2 className="text-7xl md:text-9xl font-black uppercase italic leading-[0.85] tracking-tighter mb-8">
                                        Defining <br/> The System
                                    </h2>
                                    <p className="text-lg text-zinc-400 font-medium max-w-2xl mx-auto prose-text italic">
                                        The RPM (Skateboard Pack) is more than a bag—it is the functional cornerstone of Nike SB's design language. This archive documents its evolution across two decades of utilitarian innovation.
                                    </p>
                                    <div className="mt-12 flex flex-col md:flex-row gap-4 justify-center">
                                        <button onClick={() => navigate('catalog')} className="bg-zinc-100 text-black px-12 py-5 font-black uppercase italic tracking-widest hover:bg-orange-600 hover:text-white transition-all">
                                            Explore The Collection
                                        </button>
                                        <button onClick={() => navigate('essay')} className="border border-zinc-800 text-zinc-400 px-12 py-5 font-black uppercase italic tracking-widest hover:border-zinc-700 transition-all">
                                            Read Essays
                                        </button>
                                    </div>
                                </div>
                            </section>

                            {/* Introduction Content */}
                            <section className="max-w-4xl mx-auto px-4 py-32 space-y-24">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-20">
                                    <div className="space-y-6">
                                        <h3 className="text-2xl font-black italic uppercase tracking-tighter border-l-4 border-orange-600 pl-6">The Curatorial Mission</h3>
                                        <p className="text-zinc-400 prose-text">
                                            Established in 2026, the RPM Master Archive aims to standardize the metadata and historical context of the Nike SB RPM series. As these physical artifacts degrade or become lost in secondary markets, digital preservation becomes essential for future design scholars.
                                        </p>
                                    </div>
                                    <div className="space-y-6">
                                        <h3 className="text-2xl font-black italic uppercase tracking-tighter border-l-4 border-orange-600 pl-6">Standardized Access</h3>
                                        <p className="text-zinc-400 prose-text">
                                            Each entry in this database adheres to the Dublin Core Metadata Initiative (DCMI) standards. This ensures that the data is not only browsable but machine-readable, cross-referenced with catalog codes, release years, and material specifications.
                                        </p>
                                    </div>
                                </div>
                            </section>
                        </div>
                    )}

                    {view === 'catalog' && (
                        <div className="animate-in fade-in duration-500">
                            <main className="max-w-7xl mx-auto px-4 py-12">
                                <section className="mb-12">
                                    <div className="flex flex-col md:flex-row gap-2">
                                        <div className="relative flex-1">
                                            <div className="absolute left-5 top-1/2 -translate-y-1/2 text-zinc-600">
                                                <Icon name="search" />
                                            </div>
                                            <input 
                                                type="text"
                                                placeholder="SEARCH ARCHIVE (Title, SKU...)"
                                                className="w-full bg-zinc-900 border border-zinc-800 rounded-none py-5 pl-14 pr-4 focus:border-orange-600 outline-none placeholder:text-zinc-700 font-bold uppercase tracking-widest text-sm"
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                            />
                                        </div>
                                        <select 
                                            className="bg-zinc-900 border border-zinc-800 rounded-none py-5 px-8 focus:border-orange-600 outline-none uppercase text-xs font-black tracking-widest cursor-pointer"
                                            value={selectedYear}
                                            onChange={(e) => setSelectedYear(e.target.value)}
                                        >
                                            {years.map(year => <option key={year} value={year}>{year === 'All' ? 'ALL PERIODS' : year}</option>)}
                                        </select>
                                    </div>
                                </section>

                                <div className="archive-grid">
                                    {filteredData.map((item) => (
                                        <div 
                                            key={item.id}
                                            onClick={() => setSelectedItem(item)}
                                            className="group bg-zinc-900/20 border border-zinc-900 p-8 cursor-pointer hover:border-orange-600 hover:bg-zinc-900/40 transition-all relative"
                                        >
                                            <div className="mb-10">
                                               <div className="bg-zinc-900 w-full aspect-square flex items-center justify-center relative border border-zinc-800">
                                                  <Icon name="package" className="w-20 h-20 text-zinc-800 group-hover:text-orange-600 transition-all" />
                                                  <div className="absolute bottom-6 left-6 bg-orange-600 text-white text-[9px] font-black px-3 py-1 uppercase italic tracking-widest">
                                                    {item.rarity}
                                                  </div>
                                               </div>
                                            </div>
                                            <div className="space-y-2">
                                              <p className="mono text-[11px] text-orange-500 font-bold tracking-tighter">DC.IDENTIFIER: {item.dc_identifier}</p>
                                              <h3 className="font-black text-xl uppercase leading-tight italic">{item.dc_title}</h3>
                                              <p className="text-[10px] text-zinc-500 font-bold uppercase tracking-widest">{item.dc_date} Archive</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </div>
                    )}

                    {view === 'essay' && (
                        <div className="animate-in fade-in slide-in-from-right-4 duration-700 max-w-3xl mx-auto px-4 py-32">
                            <article className="prose-text space-y-16">
                                <header className="space-y-6">
                                    <span className="text-orange-500 font-black text-xs tracking-[0.4em] uppercase">Archive Essay No. 01</span>
                                    <h2 className="text-6xl font-black uppercase italic leading-none tracking-tighter">Methodology & Standardized Data</h2>
                                    <p className="text-zinc-500 font-mono text-xs uppercase tracking-widest">Published Jan 2026 | Ref: DC-DOC-001</p>
                                </header>
                                
                                <div className="space-y-8 text-zinc-300 text-lg">
                                    <p>
                                        The digital preservation of tactical streetwear requires a shift from consumerist listing to archival documentation. This project utilizes the <strong>Dublin Core Metadata Element Set (DCMI)</strong> to categorize items based on their historical and physical properties.
                                    </p>
                                    <h4 className="text-xl font-black text-white italic uppercase tracking-tighter">I. The 15 Core Elements</h4>
                                    <p>
                                        To ensure longevity, every RPM record contains the fifteen core descriptors. This allows researchers to understand not just the 'What' (SKU: BA3241-001) but the 'Where' (Coverage) and the 'Who' (Contributors). By identifying the design leads, such as James Arizumi, we map the creative lineage of the product.
                                    </p>
                                    <h4 className="text-xl font-black text-white italic uppercase tracking-tighter">II. Taxonomic Selection</h4>
                                    <p>
                                        Subject tagging follows a controlled vocabulary. Terms like <em>Skateboarding Equipment</em> and <em>RPM Series</em> are used consistently to prevent data silos. This taxonomy allows for future integration into larger museum networks like the Internet Archive or specialized fashion repositories.
                                    </p>
                                    <blockquote className="border-l-4 border-orange-600 pl-8 py-4 italic text-zinc-500 text-2xl font-black leading-tight">
                                        "Metadata is the last remaining footprint of physical objects in a post-analog age."
                                    </blockquote>
                                    <p>
                                        Our ongoing research focuses on material degradation (Format). The transition from heavy polyester duck canvas to lighter recycled synthetics marks a significant shift in Nike SB's environmental policy, which we continue to document through physical inspection of surviving samples.
                                    </p>
                                </div>

                                <footer className="pt-20 border-t border-zinc-900">
                                    <div className="flex items-center gap-6">
                                        <div className="w-16 h-16 bg-zinc-900 border border-zinc-800 flex items-center justify-center">
                                            <Icon name="user" className="text-zinc-700" />
                                        </div>
                                        <div>
                                            <p className="text-xs font-black uppercase tracking-widest text-zinc-500">Lead Archivist</p>
                                            <p className="font-black italic uppercase text-lg">T. Segal</p>
                                        </div>
                                    </div>
                                </footer>
                            </article>
                        </div>
                    )}

                    {/* Details Sidebar (Shared across views if needed) */}
                    {selectedItem && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="absolute inset-0 bg-black/95 backdrop-blur-md" onClick={() => setSelectedItem(null)}></div>
                            <div className="relative w-full max-w-3xl bg-zinc-950 border-l border-zinc-800 h-full overflow-y-auto">
                                <div className="p-8 md:p-16">
                                    <button onClick={() => setSelectedItem(null)} className="mb-16 text-zinc-500 hover:text-white uppercase font-black text-xs tracking-[0.3em] flex items-center gap-3">
                                        <Icon name="chevron-left" /> Back
                                    </button>
                                    <h2 className="text-5xl font-black uppercase italic leading-none tracking-tighter mb-12">{selectedItem.dc_title}</h2>
                                    
                                    <div className="flex border-b border-zinc-900 mb-10">
                                        <button onClick={() => setShowDC(false)} className={`px-6 py-4 text-[10px] font-black tracking-widest uppercase border-b-2 transition-colors ${!showDC ? 'border-orange-600 text-white' : 'border-transparent text-zinc-500'}`}>General</button>
                                        <button onClick={() => setShowDC(true)} className={`px-6 py-4 text-[10px] font-black tracking-widest uppercase border-b-2 transition-colors ${showDC ? 'border-orange-600 text-white' : 'border-transparent text-zinc-500'}`}>Metadata Schema</button>
                                    </div>

                                    {showDC ? (
                                        <div className="grid grid-cols-1 gap-6 bg-zinc-900/40 p-8 border border-zinc-900 animate-in fade-in">
                                            {Object.entries(selectedItem).filter(([key]) => key.startsWith('dc_')).map(([key, value]) => (
                                                <div key={key} className="border-b border-zinc-800 pb-4 last:border-0">
                                                    <span className="dc-label uppercase block mb-1">DC.{key.split('_')[1]}</span>
                                                    <span className="mono text-xs text-zinc-400">{value}</span>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="space-y-12 animate-in fade-in">
                                            <p className="text-zinc-300 text-xl leading-relaxed italic">{selectedItem.dc_description}</p>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="p-6 bg-zinc-900 border border-zinc-800">
                                                    <p className="text-[10px] text-zinc-500 font-bold mb-1">YEAR</p>
                                                    <p className="text-2xl font-black italic">{selectedItem.dc_date}</p>
                                                </div>
                                                <div className="p-6 bg-zinc-900 border border-zinc-800">
                                                    <p className="text-[10px] text-zinc-500 font-bold mb-1">RARITY</p>
                                                    <p className="text-2xl font-black italic text-orange-500">{selectedItem.rarity}</p>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="mt-32 border-t border-zinc-900 py-20">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col items-center">
                            <div className="flex gap-12 opacity-20 filter grayscale mb-12">
                                <div className="font-black text-sm italic skew-title">NIKE SB</div>
                                <div className="font-black text-sm italic skew-title">DCMI COMPLIANT</div>
                            </div>
                            <p className="text-[10px] text-zinc-600 font-bold tracking-[0.3em] uppercase">Built for Architectural Preservation © 2026</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
