<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike SB RPM Master Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .skew-title { transform: skewX(-12deg); }
        .archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 selection:bg-orange-500">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Simplified Lucide Icon Component for HTML usage
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const INITIAL_DATA = [
            { id: 1, sku: "BA3241-001", name: "RPM Black Anthracite", year: 2012, colorway: "Black/Black", status: "Released", description: "The classic OG RPM with the iconic skateboard straps and 15-inch laptop sleeve.", rarity: "Common" },
            { id: 2, sku: "BA3241-200", name: "RPM Iguana Camo", year: 2014, colorway: "Iguana/Black", status: "Released", description: "Heavyweight textured polyester with a classic woodland camo pattern.", rarity: "Uncommon" },
            { id: 3, sku: "BA3241-010", name: "RPM Triple Black", year: 2018, colorway: "Black/Black/Black", status: "Released", description: "Water-resistant coating with blacked-out branding for a stealth look.", rarity: "Common" },
            { id: 4, sku: "BA3241-601", name: "RPM Solar Red", year: 2015, colorway: "Solar Red/White", status: "Discontinued", description: "A vibrant release from the mid-2010s era of Nike SB design.", rarity: "Rare" },
            { id: 5, sku: "BA5971-010", name: "RPM Skate Backpack 2.0", year: 2021, colorway: "Black/White", status: "Active", description: "The updated silhouette with improved shoulder strap ergonomics.", rarity: "Common" },
            { id: 6, sku: "BA3241-401", name: "RPM Midnight Navy", year: 2013, colorway: "Navy/Black", status: "Archive", description: "Part of the early RPM catalog, featuring the original zipper pull design.", rarity: "Rare" },
        ];

        const App = () => {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedYear, setSelectedYear] = useState('All');
            const [selectedItem, setSelectedItem] = useState(null);

            const years = ['All', ...new Set(INITIAL_DATA.map(item => item.year))].sort((a, b) => b - a);

            const filteredData = useMemo(() => {
                return INITIAL_DATA.filter(item => {
                    const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                          item.sku.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesYear = selectedYear === 'All' || item.year.toString() === selectedYear;
                    return matchesSearch && matchesYear;
                });
            }, [searchTerm, selectedYear]);

            return (
                <div className="min-h-screen">
                    <header className="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-orange-600 rounded-sm flex items-center justify-center font-bold text-xl skew-title">SB</div>
                                <div>
                                    <h1 className="font-black text-xl tracking-tighter uppercase italic">RPM Master Archive</h1>
                                    <p className="text-[10px] text-zinc-500 font-mono tracking-widest uppercase">Digital Museum & Catalog</p>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-12">
                        <section className="mb-12 space-y-6">
                            <div className="flex flex-col md:flex-row gap-4">
                                <div className="relative flex-1">
                                    <div className="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500">
                                        <Icon name="search" />
                                    </div>
                                    <input 
                                        type="text"
                                        placeholder="Search by SKU, Name..."
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded-none py-4 pl-12 pr-4 focus:ring-1 focus:ring-orange-600 outline-none placeholder:text-zinc-600 italic"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                                <select 
                                    className="bg-zinc-900 border border-zinc-800 rounded-none py-4 px-6 focus:ring-1 focus:ring-orange-600 outline-none uppercase text-xs font-bold tracking-widest"
                                    value={selectedYear}
                                    onChange={(e) => setSelectedYear(e.target.value)}
                                >
                                    {years.map(year => <option key={year} value={year}>{year === 'All' ? 'ALL YEARS' : year}</option>)}
                                </select>
                            </div>
                        </section>

                        <div className="archive-grid">
                            {filteredData.map((item) => (
                                <div 
                                    key={item.id}
                                    onClick={() => setSelectedItem(item)}
                                    className="group bg-zinc-900/40 border border-zinc-800 p-6 cursor-pointer hover:border-orange-500 transition-all relative"
                                >
                                    <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-100 transition-opacity">
                                       <div className="text-4xl font-black italic">{item.year}</div>
                                    </div>
                                    
                                    <div className="mb-8">
                                       <div className="bg-zinc-800 w-full aspect-square flex items-center justify-center relative mb-4">
                                          <svg width="80" height="100" viewBox="0 0 80 100" className="text-zinc-600 group-hover:text-orange-600 transition-colors">
                                            <path d="M10,20 Q10,5 40,5 Q70,5 70,20 L70,85 Q70,95 40,95 Q10,95 10,85 Z" fill="none" stroke="currentColor" strokeWidth="2"/>
                                            <rect x="20" y="30" width="40" height="40" rx="2" fill="none" stroke="currentColor" strokeWidth="1"/>
                                          </svg>
                                          <div className="absolute bottom-4 left-4 bg-orange-600 text-white text-[8px] font-bold px-2 py-0.5 uppercase italic">
                                            {item.rarity}
                                          </div>
                                       </div>
                                    </div>

                                    <div className="space-y-1">
                                      <p className="text-[10px] font-mono text-orange-500">{item.sku}</p>
                                      <h3 className="font-black text-lg uppercase leading-tight group-hover:text-white">{item.name}</h3>
                                      <p className="text-xs text-zinc-500 font-medium uppercase">{item.colorway}</p>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {filteredData.length === 0 && (
                            <div className="py-32 text-center border-2 border-dashed border-zinc-900">
                                <h3 className="text-xl font-black uppercase italic text-zinc-600">No Records Found</h3>
                            </div>
                        )}
                    </main>

                    {selectedItem && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={() => setSelectedItem(null)}></div>
                            <div className="relative w-full max-w-2xl bg-zinc-950 border-l border-zinc-800 h-full overflow-y-auto p-8 md:p-12">
                                <button onClick={() => setSelectedItem(null)} className="mb-12 text-zinc-500 hover:text-white uppercase font-bold text-xs tracking-widest flex items-center gap-2">
                                    <Icon name="arrow-left" className="w-4 h-4" /> Close
                                </button>
                                <div className="space-y-8">
                                    <div className="aspect-square bg-zinc-900 flex items-center justify-center border border-zinc-800">
                                        <Icon name="package" className="w-24 h-24 text-orange-600" />
                                    </div>
                                    <div>
                                        <span className="text-orange-500 font-mono text-sm">{selectedItem.sku}</span>
                                        <h2 className="text-5xl font-black uppercase italic leading-none">{selectedItem.name}</h2>
                                    </div>
                                    <p className="text-zinc-400 leading-relaxed italic text-lg border-l-4 border-orange-600 pl-6">
                                        "{selectedItem.description}"
                                    </p>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="p-6 bg-zinc-900 border border-zinc-800">
                                            <p className="text-[10px] text-zinc-500 font-mono mb-1 font-bold">RELEASE YEAR</p>
                                            <p className="text-2xl font-black italic">{selectedItem.year}</p>
                                        </div>
                                        <div className="p-6 bg-zinc-900 border border-zinc-800">
                                            <p className="text-[10px] text-zinc-500 font-mono mb-1 font-bold">RARITY</p>
                                            <p className="text-2xl font-black italic text-orange-500">{selectedItem.rarity}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
